<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>发一条弹幕</title>
<style>
  :root{
    --ink:#f2f6ff;
    --dim:rgba(220,232,255,.55);
    --line:rgba(150,180,255,.16);
    --cyan:#5fe3ff;
    --violet:#9b6bff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    min-height:100dvh;
    background:#05070f;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
    position:relative;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
  .g1{width:340px;height:340px;left:-120px;top:-120px;background:radial-gradient(circle,#1f6bff,transparent 68%);opacity:.6}
  .g2{width:320px;height:320px;right:-120px;top:80px;background:radial-gradient(circle,#8c3cff,transparent 68%);opacity:.55}
  .g3{width:380px;height:380px;left:20%;bottom:-200px;background:radial-gradient(circle,#00cbb8,transparent 70%);opacity:.25}

  .wrap{position:relative;z-index:2;width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px;flex:1}

  .top{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .badge{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    border:1px solid rgba(255,90,120,.3);background:rgba(255,60,90,.1);
    font-size:11px;letter-spacing:.16em;font-weight:600;color:#ff9db0;
  }
  .badge i{width:6px;height:6px;border-radius:50%;background:#ff5a78;box-shadow:0 0 8px #ff5a78;animation:beat 1.6s infinite}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
  .online{font-size:12px;color:var(--dim);letter-spacing:.08em;display:flex;align-items:center;gap:6px}
  .online i{width:6px;height:6px;border-radius:50%;background:#48e0a4;box-shadow:0 0 8px #48e0a4}

  .hero h1{
    font-size:30px;line-height:1.32;font-weight:800;letter-spacing:.01em;
    background:linear-gradient(96deg,#fff,#a9cbff 52%,#d3b0ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin-top:10px;font-size:13.5px;line-height:1.7;color:var(--dim)}

  .card{
    position:relative;border-radius:26px;padding:18px;
    background:linear-gradient(170deg,rgba(22,32,60,.86),rgba(12,18,36,.92));
    border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:26px;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 0%,rgba(95,227,255,.10),transparent 60%);
  }
  textarea{
    width:100%;min-height:132px;resize:none;border:0;outline:none;background:transparent;
    color:var(--ink);font-size:18px;line-height:1.65;font-family:inherit;
    padding:8px 6px 0;letter-spacing:.01em;
  }
  textarea::placeholder{color:rgba(190,210,245,.34)}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:0 6px}
  .count{font-size:12px;color:rgba(190,210,245,.4);font-variant-numeric:tabular-nums}
  .count.warn{color:#ffb36b}
  .nickline{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
  .nickline svg{flex:0 0 auto;opacity:.45}
  input#nick{
    flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);
    font-size:15px;font-family:inherit;
  }
  input#nick::placeholder{color:rgba(190,210,245,.3)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{
    border:1px solid rgba(150,180,255,.18);background:rgba(120,160,255,.08);
    color:rgba(205,222,255,.85);font-size:12.5px;padding:7px 12px;border-radius:999px;
    font-family:inherit;cursor:pointer;transition:.2s;
  }
  .chip:active{transform:scale(.96);background:rgba(120,160,255,.18)}

  .send{
    margin-top:18px;width:100%;border:0;border-radius:17px;padding:17px;
    font-size:17px;font-weight:700;letter-spacing:.08em;color:#04101d;font-family:inherit;
    background:linear-gradient(96deg,var(--cyan),#8fb4ff 48%,var(--violet));
    box-shadow:0 14px 34px rgba(95,227,255,.22),0 4px 14px rgba(155,107,255,.24);
    cursor:pointer;transition:transform .16s,box-shadow .2s,filter .2s;
    position:relative;overflow:hidden;
  }
  .send:active{transform:translateY(1px) scale(.995)}
  .send[disabled]{filter:saturate(.55) brightness(.85);cursor:default;box-shadow:none}
  .send .spinner{
    display:none;width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(4,16,29,.25);border-top-color:#04101d;
    animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px;
  }
  .send.loading .spinner{display:inline-block}
  .send.loading .label{opacity:.8}
  @keyframes spin{to{transform:rotate(360deg)}}

  .recent{
    border-radius:20px;padding:14px 16px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);
    display:flex;flex-direction:column;gap:9px;
  }
  .recent .t{font-size:11px;letter-spacing:.16em;color:rgba(190,210,245,.38)}
  .recent .item{font-size:13.5px;color:rgba(226,236,255,.8);line-height:1.5;display:flex;gap:8px;min-width:0}
  .recent .item b{font-weight:600;color:rgba(160,200,255,.9);flex:0 0 auto}
  .recent .item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recent .none{font-size:13px;color:rgba(190,210,245,.35)}

  .foot{margin-top:auto;padding-top:26px;text-align:center;font-size:11.5px;letter-spacing:.1em;color:rgba(190,210,245,.3)}

  .closed-tip{
    display:none;margin-bottom:14px;padding:12px 14px;border-radius:12px;
    background:rgba(255,120,120,.09);border:1px solid rgba(255,120,120,.25);
    color:#ffc2c2;font-size:13px;line-height:1.6;letter-spacing:.04em;
  }
  .closed-tip.on{display:block}
  body.is-closed textarea,body.is-closed input#nick{opacity:.5}

  .toast{
    position:fixed;left:50%;bottom:38px;transform:translate(-50%,20px);
    padding:13px 22px;border-radius:999px;font-size:14px;letter-spacing:.04em;
    background:rgba(30,45,80,.92);border:1px solid rgba(150,190,255,.22);
    color:#eaf2ff;box-shadow:0 18px 40px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1);z-index:9;
    backdrop-filter:blur(14px);max-width:86vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.ok{border-color:rgba(72,224,164,.35)}
  .toast.err{border-color:rgba(255,120,120,.4)}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<div class="wrap">
  <div class="top">
    <span class="badge"><i></i>LIVE 弹幕墙</span>
    <span class="online"><i></i>发送即上墙</span>
  </div>

  <div class="hero">
    <h1>说点什么，<br>让全场都看见</h1>
    <p>发送后会立刻出现在大屏上，从右往左飘过去。</p>
  </div>

  <div class="card">
    <div class="closed-tip" id="closedTip">本场弹幕已结束，感谢参与。想再发的话请等主持人重新开启。</div>
    <textarea id="text" maxlength="40" placeholder="想对大家说什么？" autocomplete="off" enterkeyhint="send"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 40</span>
    </div>

    <div class="nickline">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#bcd2ff" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="8" r="3.4"/><path d="M4.8 20c1.1-3.6 3.9-5.4 7.2-5.4s6.1 1.8 7.2 5.4"/>
      </svg>
      <input id="nick" maxlength="12" placeholder="署名（选填，会显示在弹幕前）" autocomplete="off">
    </div>

    <div class="chips" id="chips">
      <button class="chip" type="button">好耶</button>
      <button class="chip" type="button">这个可以有</button>
      <button class="chip" type="button">全场最佳</button>
      <button class="chip" type="button">哈哈哈哈</button>
    </div>

    <button class="send" id="send" type="button">
      <span class="spinner"></span><span class="label">发 送 弹 幕</span>
    </button>
  </div>

  <div class="recent">
    <div class="t">刚刚上墙</div>
    <div id="recentList"><div class="none">还没有人说话，你可以是第一个</div></div>
  </div>

  <div class="foot">扫码即发 · 无需关注 · 请友善发言<br><span style="opacity:.7">微信提示「即将离开微信」时，点击继续访问即可</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var textEl = document.getElementById('text');
  var nickEl = document.getElementById('nick');
  var countEl = document.getElementById('count');
  var sendBtn = document.getElementById('send');
  var toastEl = document.getElementById('toast');
  var listEl = document.getElementById('recentList');
  var closedTip = document.getElementById('closedTip');
  var MAX = 40;
  var sending = false;
  var isClosed = false;
  var recent = [];
  var toastTimer;

  function setClosed(v) {
    isClosed = v;
    document.body.classList.toggle('is-closed', v);
    closedTip.classList.toggle('on', v);
    textEl.disabled = v;
    nickEl.disabled = v;
    sendBtn.disabled = v || sending;
    sendBtn.querySelector('.label').textContent = v ? '本场弹幕已结束' : '发 送 弹 幕';
  }

  /* 从 URL 里带文案（方便现场做预设话术） */
  var preset = new URLSearchParams(location.search).get('text');
  if (preset) textEl.value = preset.slice(0, MAX);

  function updateCount() {
    var n = Array.from(textEl.value).length;
    countEl.textContent = n + ' / ' + MAX;
    countEl.classList.toggle('warn', n >= MAX - 6);
  }

  function toast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast ' + (type || ''); }, 2400);
  }

  function renderRecent() {
    if (!recent.length) {
      listEl.innerHTML = '<div class="none">还没有人说话，你可以是第一个</div>';
      return;
    }
    listEl.innerHTML = '';
    recent.slice(-3).reverse().forEach(function (m) {
      var row = document.createElement('div');
      row.className = 'item';
      if (m.nick) {
        var b = document.createElement('b');
        b.textContent = m.nick;
        row.appendChild(b);
      }
      var s = document.createElement('span');
      s.textContent = m.text;
      row.appendChild(s);
      listEl.appendChild(row);
    });
  }

  textEl.addEventListener('input', updateCount);
  updateCount();

  textEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });

  document.getElementById('chips').addEventListener('click', function (e) {
    if (isClosed) return;
    var btn = e.target.closest('.chip');
    if (!btn) return;
    var v = btn.textContent;
    textEl.value = textEl.value ? (textEl.value + ' ' + v).slice(0, MAX) : v;
    updateCount();
    textEl.focus();
  });

  sendBtn.addEventListener('click', submit);

  function submit() {
    if (sending) return;
    if (isClosed) {
      toast('本场弹幕已结束，感谢参与', 'err');
      return;
    }
    var text = textEl.value.trim();
    if (!text) {
      toast('先写点什么吧', 'err');
      textEl.focus();
      return;
    }

    sending = true;
    sendBtn.disabled = true;
    sendBtn.classList.add('loading');

    fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, nick: nickEl.value.trim() })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (res.ok && res.data.ok) {
          toast('已发送，抬头看大屏', 'ok');
          textEl.value = '';
          updateCount();
          textEl.focus();
        } else {
          if (res.data.code === 'closed') {
            setClosed(true);
            textEl.value = '';
            updateCount();
          }
          toast(res.data.error || '发送失败，再试一次', 'err');
        }
      })
      .catch(function () {
        toast('网络不太好，再试一次', 'err');
      })
      .finally(function () {
        sending = false;
        sendBtn.disabled = isClosed;
        sendBtn.classList.remove('loading');
      });
  }

  /* 大屏实时回显，让发送者看到自己的弹幕已上墙 */
  function connectPreview() {
    if (!window.WebSocket) return;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onmessage = function (e) {
      var data;
      try { data = JSON.parse(e.data); } catch (err) { return; }

      if (data.type === 'init') {
        if (data.closed) setClosed(true);
        return;
      }
      if (data.type === 'closed') {
        setClosed(true);
        return;
      }
      if (data.type === 'open') {
        setClosed(false);
        return;
      }
      if (data.type === 'clear') {
        setClosed(false);
        recent = [];
        renderRecent();
        return;
      }
      if (data.type !== 'danmaku' || !data.message) return;
      recent.push(data.message);
      if (recent.length > 6) recent.shift();
      renderRecent();
    };

    ws.onclose = function () {
      setTimeout(connectPreview, 2000);
    };
  }

  fetch('/api/info').then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.history) { recent = d.history; renderRecent(); }
    if (d && d.closed) setClosed(true);
    connectPreview();
  }).catch(function () {
    connectPreview();
  });
})();
</script>
</body>
</html>
